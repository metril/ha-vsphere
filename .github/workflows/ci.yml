name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to exact version: this repo publishes no moving v8/v9 major tag
      # (moving tags stop at v7), so `@v9` fails to resolve.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check custom_components/ tests/
      - run: uv run ruff format --check custom_components/ tests/
      - run: uv run pytest tests/ -v

  # Advisory until the pre-existing mypy error count reaches zero; does not
  # block the pipeline.
  typecheck:
    name: Type check (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      # Pinned to exact version: this repo publishes no moving v8/v9 major tag
      # (moving tags stop at v7), so `@v9` fails to resolve.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run mypy custom_components/vsphere/
